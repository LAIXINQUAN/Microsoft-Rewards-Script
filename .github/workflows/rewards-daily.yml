name: rewards-daily

on:
  schedule:
    # 主时段：北京 06:20（UTC 22:20）
    - cron: "20 22 * * *"
    # 备用 1：北京 07:05（UTC 23:05）
    - cron: "5 23 * * *"
    # 备用 2：北京 08:10（UTC 00:10）
    - cron: "10 0 * * *"
    # 备用 3：北京 10:20（UTC 02:20）
    - cron: "20 2 * * *"
    # 备用 4：北京 13:40（UTC 05:40）
    - cron: "40 5 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "开启 debug 日志"
        required: false
        default: "false"
      force:
        description: "忽略今日已完成标记，强制执行"
        required: false
        default: "false"

# 排队不并行：后到的备份时段实例等前一个跑完，会看到「今日已完成」直接跳过
concurrency:
  group: rewards-daily
  cancel-in-progress: false

jobs:
  gate:
    name: 判断今日是否需要执行
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      day: ${{ steps.d.outputs.day }}
      should_run: ${{ steps.judge.outputs.should_run }}
    steps:
      - name: 计算北京日期
        id: d
        run: echo "day=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - name: 查询今日完成标记
        id: done
        uses: actions/cache/restore@v4
        with:
          path: .run-state
          key: rewards-done-${{ steps.d.outputs.day }}

      - name: 结论
        id: judge
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::手动指定 force=true，强制执行"
          elif [ "${{ steps.done.outputs.cache-hit }}" = "true" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::今天（${{ steps.d.outputs.day }}）已签到成功过，本次是备用时段，跳过"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::今天（${{ steps.d.outputs.day }}）还没签到，开始执行"
          fi

  run:
    name: 执行签到
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: 安装 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # 还原上次跑完保存的会话（滚动缓存，restore-keys 前缀匹配取最新）
      - name: 还原会话缓存
        uses: actions/cache/restore@v4
        with:
          path: sessions
          key: sessions-${{ github.run_id }}
          restore-keys: |
            sessions-

      - name: 注入初始会话（首次运行时用 Secret）
        env:
          SESSIONS_B64: ${{ secrets.SESSIONS_DB_B64 }}
        run: |
          set -e
          mkdir -p sessions
          if [ -s sessions/sessions.db ]; then
            echo "使用缓存里的 sessions.db：$(stat -c%s sessions/sessions.db) 字节"
          elif [ -n "$SESSIONS_B64" ]; then
            printf '%s' "$SESSIONS_B64" | base64 -d | gunzip > sessions/sessions.db
            echo "从 Secret 解出 sessions.db：$(stat -c%s sessions/sessions.db) 字节"
          else
            echo "::error::既没有缓存也没有 SESSIONS_DB_B64，无法登录"
            exit 1
          fi

      - name: 写 config.json
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          set -e
          printf "%s" "$CONFIG_JSON" > config.json
          node -e "JSON.parse(require('fs').readFileSync('config.json','utf8')); console.log('config.json 合法')"

      - name: 写 .env
        env:
          MS_EMAIL: ${{ secrets.ACCOUNT_1_EMAIL }}
          MS_PASS: ${{ secrets.ACCOUNT_1_PASSWORD }}
        run: |
          set -e
          {
            echo "ACCOUNT_1_EMAIL=$MS_EMAIL"
            if [ -n "$MS_PASS" ]; then echo "ACCOUNT_1_PASSWORD=$MS_PASS"; fi
            echo "ACCOUNT_1_LANG_CODE=zh-CN"
            echo "ACCOUNT_1_GEO_LOCALE=CN"
            echo "ACCOUNT_1_SAVE_FINGERPRINT_MOBILE=false"
            echo "ACCOUNT_1_SAVE_FINGERPRINT_DESKTOP=false"
          } > .env
          sed 's/=.*/=***/g' .env

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 安装 Chromium
        run: npx patchright install --with-deps chromium

      - name: 编译
        run: npm run build

      - name: 记录运行前积分
        continue-on-error: true
        env:
          MAIL_AUTH: ${{ secrets.MAIL_AUTH }}
        run: node scripts/notify/mail-report.mjs capture

      - name: 运行签到
        env:
          TZ: Asia/Shanghai
          DEBUG_MODE: ${{ github.event.inputs.debug }}
        run: |
          set -o pipefail
          npm start 2>&1 | tee rewards-run.log

      - name: 发送积分邮件
        if: always()
        continue-on-error: true
        env:
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_AUTH: ${{ secrets.MAIL_AUTH }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          RUN_STATUS: ${{ job.status }}
          RUN_LOG: rewards-run.log
        run: node scripts/notify/mail-report.mjs report

      - name: 保存会话缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: sessions
          key: sessions-${{ github.run_id }}

      - name: 写今日完成标记
        if: success()
        run: |
          mkdir -p .run-state
          echo "done at $(TZ=Asia/Shanghai date -Iseconds)" > .run-state/done

      - name: 保存今日标记（后续备用时段看到就跳过）
        if: success()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .run-state
          key: rewards-done-${{ needs.gate.outputs.day }}

      - name: 汇总
        if: always()
        run: |
          {
            echo "### 运行结束"
            echo "- 触发方式：${{ github.event_name }}"
            echo "- 北京日期：${{ needs.gate.outputs.day }}"
            echo "- job 结论：${{ job.status }}"
            if [ -f sessions/sessions.db ]; then
              echo ""
              echo "会话库：$(stat -c%s sessions/sessions.db) 字节"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
